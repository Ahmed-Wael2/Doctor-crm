<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>دفتر الزيارات</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#1B2A33" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="دفتر الزيارات" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #FAF8F3;
    --ink: #1B2A33;
    --primary: #2F6E68;
    --accent: #C9971F;
    --card: #F1ECE1;
    --line: #E2DACB;
    --muted: #5A5548;
    --muted2: #8A8477;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, 'Geeza Pro', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  header.app-header {
    padding: 16px 18px calc(16px + env(safe-area-inset-top, 0px));
    padding-top: max(16px, env(safe-area-inset-top));
    background: var(--ink);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 34px; height: 34px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .brand-title { font-size: 16px; font-weight: 700; }
  .brand-sub { font-size: 11px; color: #B9C4C7; }
  button { font-family: inherit; cursor: pointer; }
  .btn-add {
    display: flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--ink); border: none; border-radius: 8px;
    padding: 9px 12px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
  }
  .btn-import { background: transparent; border: 1px solid #4A5A63; color: var(--bg); }
  .search-wrap { padding: 14px 16px 8px; }
  .search-box { position: relative; }
  .search-box input {
    width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line);
    font-size: 14px; background: #fff; font-family: inherit; outline: none;
  }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--muted); white-space: nowrap;
  }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  #list { padding: 4px 14px 90px; }
  .doc-card {
    padding: 13px 13px; border-radius: 10px; margin-bottom: 8px; background: #fff;
    border: 1px solid #EDE7D9;
  }
  .doc-card.active { background: #EFE7D4; border-color: var(--accent); }
  .doc-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .doc-name { font-size: 14.5px; font-weight: 700; }
  .doc-spec { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-top: 4px; flex-shrink: 0; }
  .doc-meta { font-size: 11.5px; color: var(--muted2); margin-top: 7px; display: flex; align-items: center; gap: 4px; }
  .empty { text-align: center; color: var(--muted2); font-size: 13px; margin-top: 40px; }

  /* Detail overlay */
  #detail {
    position: fixed; inset: 0; background: #fff; z-index: 20; display: none;
    flex-direction: column; overflow-y: auto;
  }
  #detail.open { display: flex; }
  .detail-header { padding: calc(16px + env(safe-area-inset-top,0px)) 20px 16px; border-bottom: 1px solid var(--line); }
  .back-btn { background: none; border: none; color: var(--primary); font-size: 13px; display: flex; align-items: center; gap: 4px; padding: 0; margin-bottom: 10px; }
  .detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .detail-name { font-size: 20px; font-weight: 700; }
  .spec-badge { display: inline-block; font-size: 11px; font-weight: 700; color: var(--primary); background: #EAF2F0; padding: 3px 10px; border-radius: 999px; margin-top: 6px; }
  .btn-visit { display: flex; align-items: center; gap: 6px; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 9px 12px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .btn-delete { background: none; border: 1px solid #E3B8B8; color: #B84A4A; border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 700; margin-top: 12px; }
  .contact-row { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .contact-item { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .prod-tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .prod-tag { font-size: 11.5px; background: #FBF1DC; color: #8A6413; padding: 4px 10px; border-radius: 6px; border: 1px solid #F0DFAF; }
  .visits-wrap { padding: 18px 20px 60px; }
  .visits-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 12px; }
  .visit-item { display: flex; gap: 12px; margin-bottom: 18px; }
  .visit-dot-col { display: flex; flex-direction: column; align-items: center; }
  .visit-dot { width: 10px; height: 10px; border-radius: 50%; background: #D8D0BE; margin-top: 4px; flex-shrink: 0; }
  .visit-dot.first { background: var(--accent); }
  .visit-line { width: 1px; flex: 1; background: var(--line); margin-top: 2px; }
  .visit-date { font-size: 12.5px; font-weight: 700; }
  .visit-note { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .visit-tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
  .visit-tag { font-size: 10.5px; background: #EAF2F0; color: var(--primary); padding: 2px 8px; border-radius: 5px; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(27,42,51,0.45); z-index: 30; display: none; align-items: flex-end; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  @media (min-width: 600px) { .modal-backdrop.open { align-items: center; } }
  .modal { background: var(--bg); border-radius: 16px 16px 0 0; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (min-width: 600px) { .modal { border-radius: 14px; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  .modal-title { font-size: 15px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--muted2); font-size: 20px; line-height: 1; }
  .modal-body { padding: 18px 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    font-size: 14px; font-family: inherit; outline: none; background: #fff;
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .prod-toggle-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
  .prod-toggle { font-size: 12px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); }
  .prod-toggle.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-save { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 14px; margin-top: 4px; }
  .btn-save.gold { background: var(--accent); color: var(--ink); }
  .btn-save.teal { background: var(--primary); color: #fff; }
  .btn-save:disabled { background: #D8D0BE; color: #fff; }

  .fab-empty { text-align: center; color: var(--muted2); padding: 60px 20px; font-size: 13px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-icon">💊</div>
    <div>
      <div class="brand-title">دفتر الزيارات</div>
      <div class="brand-sub" id="docCount">0 طبيب في المتابعة</div>
    </div>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="btn-add btn-import" onclick="document.getElementById('excelFileInput').click()">📥 استيراد</button>
    <button class="btn-add" onclick="openAddDoctor()">+ إضافة طبيب</button>
  </div>
  <input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleExcelImport(event)" />
</header>

<div class="search-wrap">
  <div class="search-box">
    <input id="searchInput" placeholder="دور على اسم دكتور..." oninput="render()" />
  </div>
  <div class="chips" id="chips"></div>
</div>

<div id="list"></div>

<!-- Detail overlay -->
<div id="detail">
  <div class="detail-header">
    <button class="back-btn" onclick="closeDetail()">→ رجوع للقايمة</button>
    <div class="detail-top">
      <div>
        <div class="detail-name" id="detName"></div>
        <div class="spec-badge" id="detSpec"></div>
      </div>
      <button class="btn-visit" onclick="openAddVisit()">+ تسجيل زيارة</button>
    </div>
    <button class="btn-delete" onclick="confirmDeleteDoctor()">🗑 حذف الطبيب</button>
    <div class="contact-row" id="detContact"></div>
    <div class="prod-tags" id="detProducts"></div>
  </div>
  <div class="visits-wrap">
    <div class="visits-title" id="visitsTitle"></div>
    <div id="visitsList"></div>
  </div>
</div>

<!-- Import preview modal -->
<div class="modal-backdrop" id="importBackdrop" onclick="if(event.target===this)closeImport()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">استيراد من إكسيل</div>
      <button class="modal-close" onclick="closeImport()">×</button>
    </div>
    <div class="modal-body">
      <div id="importSummary" style="font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.7;"></div>
      <button class="btn-save gold" id="confirmImportBtn" onclick="confirmImport()">تأكيد الاستيراد</button>
    </div>
  </div>
</div>

<!-- Add doctor modal -->

<div class="modal-backdrop" id="addDoctorBackdrop" onclick="if(event.target===this)closeAddDoctor()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">إضافة طبيب جديد</div>
      <button class="modal-close" onclick="closeAddDoctor()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>اسم الطبيب</label><input id="newDocName" placeholder="د. ..." /></div>
      <div class="field"><label>التخصص</label><select id="newDocSpecialty"></select></div>
      <div class="field"><label>رقم الموبايل</label><input id="newDocPhone" placeholder="01xxxxxxxxx" /></div>
      <div class="field"><label>مكان العيادة</label><input id="newDocAddress" placeholder="اسم العيادة أو المستشفى" /></div>
      <div class="field"><label>المنتجات المهتم بيها (افصل بفاصلة)</label><input id="newDocProducts" placeholder="كونكور, جلوكوفاج" /></div>
      <button class="btn-save gold" id="saveDoctorBtn" onclick="saveNewDoctor()" disabled>حفظ الطبيب</button>
    </div>
  </div>
</div>

<!-- Add visit modal -->
<div class="modal-backdrop" id="addVisitBackdrop" onclick="if(event.target===this)closeAddVisit()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="addVisitTitle">تسجيل زيارة</div>
      <button class="modal-close" onclick="closeAddVisit()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>تاريخ الزيارة</label><input type="date" id="newVisitDate" /></div>
      <div class="field"><label>ملاحظات - اتكلمنا في إيه؟</label><textarea id="newVisitNote" placeholder="مثلاً: مهتم بالمنتج الجديد، عايز عينات..." oninput="checkVisitValid()"></textarea></div>
      <div class="field" id="visitProductsField" style="display:none;">
        <label>المنتجات اللي اتكلمنا فيها</label>
        <div class="prod-toggle-wrap" id="visitProductsToggles"></div>
      </div>
      <button class="btn-save teal" id="saveVisitBtn" onclick="saveNewVisit()" disabled>حفظ الزيارة</button>
    </div>
  </div>
</div>

<script>
const SPECIALTIES = ["باطنة","أطفال","جراحة","نساء وتوليد","قلب","جلدية","عظام","أسنان","مخ وأعصاب"];
const STORAGE_KEY = "daftar-ziyarat-doctors";

const seedDoctors = [
  { id:"d1", name:"د. أحمد فتحي", specialty:"باطنة", phone:"01001234567", address:"عيادة النور - المهندسين",
    products:["كونكور","جلوكوفاج"],
    visits:[
      {date:"2026-07-28", note:"اتكلمنا عن نتائج الدراسة الجديدة لجلوكوفاج، مهتم يجرب مع مرضى السكر النوع التاني", products:["جلوكوفاج"]},
      {date:"2026-06-15", note:"زيارة تعريفية أولى، استقبال كويس", products:["كونكور","جلوكوفاج"]}
    ]},
  { id:"d2", name:"د. منى الشريف", specialty:"أطفال", phone:"01112345678", address:"مستشفى الأطفال - الدقي",
    products:["أوجمنتين شراب"],
    visits:[{date:"2026-06-02", note:"طلبت عينات إضافية للعيادة، عندها زحمة مرضى الصيف", products:["أوجمنتين شراب"]}]},
  { id:"d3", name:"د. كريم عبد الله", specialty:"قلب", phone:"01223456789", address:"مركز القلب - المعادي",
    products:["بلافيكس","كونكور"], visits:[] }
];

let doctors = loadDoctors();
let specialtyFilter = "الكل";
let selectedId = null;

function loadDoctors() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return seedDoctors;
}
function saveDoctors() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(doctors));
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}
function lastVisitOf(doc) {
  if (!doc.visits.length) return null;
  return [...doc.visits].sort((a,b)=> new Date(b.date)-new Date(a.date))[0];
}
function esc(s) {
  const d = document.createElement("div");
  d.innerText = s == null ? "" : s;
  return d.innerHTML;
}

function renderChips() {
  const chipsEl = document.getElementById("chips");
  const all = ["الكل", ...SPECIALTIES];
  chipsEl.innerHTML = all.map(s =>
    `<button class="chip ${s===specialtyFilter?'active':''}" onclick="setFilter('${s}')">${s}</button>`
  ).join("");
}
function setFilter(s) { specialtyFilter = s; render(); }

function render() {
  document.getElementById("docCount").innerText = doctors.length + " طبيب في المتابعة";
  renderChips();
  const query = document.getElementById("searchInput").value.trim();
  let filtered = doctors
    .filter(d => specialtyFilter === "الكل" ? true : d.specialty === specialtyFilter)
    .filter(d => d.name.includes(query) || d.specialty.includes(query))
    .sort((a,b) => {
      const la = lastVisitOf(a)?.date || "1900-01-01";
      const lb = lastVisitOf(b)?.date || "1900-01-01";
      return new Date(la) - new Date(lb);
    });

  const listEl = document.getElementById("list");
  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty">مفيش دكتور مطابق للبحث</div>`;
    return;
  }
  listEl.innerHTML = filtered.map(d => {
    const lv = lastVisitOf(d);
    const days = daysSince(lv?.date);
    const overdue = days === null || days > 21;
    const metaText = lv ? `آخر زيارة من ${days} يوم` : "لسه ما اتزارش";
    return `
      <div class="doc-card ${d.id===selectedId?'active':''}" onclick="openDetail('${d.id}')">
        <div class="doc-row">
          <div>
            <div class="doc-name">${esc(d.name)}</div>
            <div class="doc-spec">${esc(d.specialty)}</div>
          </div>
          ${overdue ? '<div class="dot"></div>' : ''}
        </div>
        <div class="doc-meta">🕒 ${metaText}</div>
      </div>`;
  }).join("");
}

function openDetail(id) {
  selectedId = id;
  const d = doctors.find(x => x.id === id);
  if (!d) return;
  document.getElementById("detName").innerText = d.name;
  document.getElementById("detSpec").innerText = d.specialty;
  let contact = "";
  if (d.phone) contact += `<div class="contact-item">📞 ${esc(d.phone)}</div>`;
  if (d.address) contact += `<div class="contact-item">📍 ${esc(d.address)}</div>`;
  document.getElementById("detContact").innerHTML = contact;
  document.getElementById("detProducts").innerHTML = (d.products||[]).map(p => `<span class="prod-tag">${esc(p)}</span>`).join("");

  const sorted = [...d.visits].sort((a,b)=> new Date(b.date)-new Date(a.date));
  document.getElementById("visitsTitle").innerText = `سجل الزيارات (${d.visits.length})`;
  const visitsList = document.getElementById("visitsList");
  if (sorted.length === 0) {
    visitsList.innerHTML = `<div class="empty" style="margin-top:0;">لسه مفيش زيارات مسجلة لهذا الطبيب</div>`;
  } else {
    visitsList.innerHTML = sorted.map((v,i) => `
      <div class="visit-item">
        <div class="visit-dot-col">
          <div class="visit-dot ${i===0?'first':''}"></div>
          ${i < sorted.length-1 ? '<div class="visit-line"></div>' : ''}
        </div>
        <div>
          <div class="visit-date">${new Date(v.date).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})}</div>
          <div class="visit-note">${esc(v.note)}</div>
          ${(v.products&&v.products.length) ? `<div class="visit-tags">${v.products.map(p=>`<span class="visit-tag">${esc(p)}</span>`).join("")}</div>` : ''}
        </div>
      </div>`).join("");
  }
  document.getElementById("detail").classList.add("open");
  render();
}
function closeDetail() {
  document.getElementById("detail").classList.remove("open");
  selectedId = null;
  render();
}
function confirmDeleteDoctor() {
  const d = doctors.find(x => x.id === selectedId);
  if (!d) return;
  if (confirm(`متأكد إنك عايز تمسح "${d.name}"؟ سجل الزيارات كله هيتمسح ومش هترجع.`)) {
    doctors = doctors.filter(x => x.id !== selectedId);
    saveDoctors();
    closeDetail();
  }
}

// Add doctor modal
function openAddDoctor() {
  document.getElementById("newDocName").value = "";
  document.getElementById("newDocPhone").value = "";
  document.getElementById("newDocAddress").value = "";
  document.getElementById("newDocProducts").value = "";
  const sel = document.getElementById("newDocSpecialty");
  sel.innerHTML = SPECIALTIES.map(s => `<option value="${s}">${s}</option>`).join("");
  document.getElementById("saveDoctorBtn").disabled = true;
  document.getElementById("addDoctorBackdrop").classList.add("open");
  document.getElementById("newDocName").oninput = () => {
    document.getElementById("saveDoctorBtn").disabled = !document.getElementById("newDocName").value.trim();
  };
}
function closeAddDoctor() {
  document.getElementById("addDoctorBackdrop").classList.remove("open");
}
function saveNewDoctor() {
  const name = document.getElementById("newDocName").value.trim();
  if (!name) return;
  const doc = {
    id: "d" + Date.now(),
    name,
    specialty: document.getElementById("newDocSpecialty").value,
    phone: document.getElementById("newDocPhone").value.trim(),
    address: document.getElementById("newDocAddress").value.trim(),
    products: document.getElementById("newDocProducts").value.split(",").map(p=>p.trim()).filter(Boolean),
    visits: []
  };
  doctors.unshift(doc);
  saveDoctors();
  closeAddDoctor();
  openDetail(doc.id);
}

// Add visit modal
let visitProductsSelected = [];
function openAddVisit() {
  const d = doctors.find(x => x.id === selectedId);
  if (!d) return;
  document.getElementById("addVisitTitle").innerText = "تسجيل زيارة - " + d.name;
  document.getElementById("newVisitDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("newVisitNote").value = "";
  visitProductsSelected = [...(d.products||[])];
  const field = document.getElementById("visitProductsField");
  const toggles = document.getElementById("visitProductsToggles");
  if (d.products && d.products.length) {
    field.style.display = "block";
    renderVisitToggles(d.products);
  } else {
    field.style.display = "none";
  }
  document.getElementById("saveVisitBtn").disabled = true;
  document.getElementById("addVisitBackdrop").classList.add("open");
}
function renderVisitToggles(products) {
  const toggles = document.getElementById("visitProductsToggles");
  toggles.innerHTML = products.map(p => `
    <button type="button" class="prod-toggle ${visitProductsSelected.includes(p)?'active':''}" onclick="toggleVisitProduct('${esc(p).replace(/'/g,"\\'")}')">${visitProductsSelected.includes(p)?'✓ ':''}${esc(p)}</button>
  `).join("");
}
function toggleVisitProduct(p) {
  if (visitProductsSelected.includes(p)) {
    visitProductsSelected = visitProductsSelected.filter(x => x !== p);
  } else {
    visitProductsSelected.push(p);
  }
  const d = doctors.find(x => x.id === selectedId);
  renderVisitToggles(d.products);
}
function checkVisitValid() {
  document.getElementById("saveVisitBtn").disabled = !document.getElementById("newVisitNote").value.trim();
}
function closeAddVisit() {
  document.getElementById("addVisitBackdrop").classList.remove("open");
}
function saveNewVisit() {
  const note = document.getElementById("newVisitNote").value.trim();
  if (!note) return;
  const d = doctors.find(x => x.id === selectedId);
  if (!d) return;
  d.visits.unshift({
    date: document.getElementById("newVisitDate").value,
    note,
    products: visitProductsSelected
  });
  saveDoctors();
  closeAddVisit();
  openDetail(d.id);
}

// Excel import
let pendingImportDoctors = [];
function findCol(row, candidates) {
  const keys = Object.keys(row);
  for (const key of keys) {
    const norm = key.trim().toLowerCase();
    if (candidates.some(c => norm.includes(c))) return key;
  }
  return null;
}
function handleExcelImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      if (!rows.length) { alert("الشيت فاضي أو مش مقروء."); return; }

      const first = rows[0];
      const nameCol = findCol(first, ["اسم", "name", "طبيب", "doctor"]);
      const specCol = findCol(first, ["تخصص", "specialty", "spec"]);
      const phoneCol = findCol(first, ["موبايل", "تليفون", "هاتف", "phone", "mobile"]);
      const addrCol = findCol(first, ["عنوان", "عيادة", "مكان", "address", "clinic"]);
      const prodCol = findCol(first, ["منتج", "product"]);

      if (!nameCol) {
        alert("مش لاقي عمود اسم الطبيب في الشيت. تأكد إن فيه عمود اسمه 'الاسم' أو 'Name'.");
        return;
      }

      pendingImportDoctors = rows
        .filter(r => String(r[nameCol]).trim())
        .map(r => ({
          id: "d" + Date.now() + Math.random().toString(36).slice(2, 7),
          name: String(r[nameCol]).trim(),
          specialty: specCol ? String(r[specCol]).trim() || SPECIALTIES[0] : SPECIALTIES[0],
          phone: phoneCol ? String(r[phoneCol]).trim() : "",
          address: addrCol ? String(r[addrCol]).trim() : "",
          products: prodCol ? String(r[prodCol]).split(/[,،]/).map(p => p.trim()).filter(Boolean) : [],
          visits: []
        }));

      document.getElementById("importSummary").innerHTML =
        `لقيت <b>${pendingImportDoctors.length}</b> طبيب في الشيت.<br/>` +
        `الأعمدة اللي اتعرفت: ${[nameCol && "الاسم", specCol && "التخصص", phoneCol && "الموبايل", addrCol && "العنوان", prodCol && "المنتجات"].filter(Boolean).join(" - ")}` +
        (pendingImportDoctors.length ? `<br/><br/>أول طبيب: <b>${esc(pendingImportDoctors[0].name)}</b> - ${esc(pendingImportDoctors[0].specialty)}` : "");
      document.getElementById("importBackdrop").classList.add("open");
    } catch (err) {
      alert("حصل خطأ في قراءة الملف. تأكد إنه ملف إكسيل (.xlsx) أو CSV سليم.");
    } finally {
      event.target.value = "";
    }
  };
  reader.readAsArrayBuffer(file);
}
function closeImport() {
  document.getElementById("importBackdrop").classList.remove("open");
  pendingImportDoctors = [];
}
function confirmImport() {
  if (!pendingImportDoctors.length) { closeImport(); return; }
  doctors = [...pendingImportDoctors, ...doctors];
  saveDoctors();
  closeImport();
  render();
}

// init
saveDoctors();
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
